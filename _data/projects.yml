# ShambaTrak
- project: ShambaTrak
  role: Co-Founder & Smart Contracts Developer (Cartesi Blockchain)
  duration: 2024 &mdash; 2024
  # url: "#"
  description: A transparent and verifiable system for tracking (USSD for feature phones) fertiliser &planting seeds from source to farmers in Nakuru County, Kenya. We aim to solve this issue by establishing a transparent, verifiable system that allows farmers to verify if the maize seeds they are planting are from a credible and certified source. Our system will run on the Cartesi blockchain. Our case study is maize seeds.

