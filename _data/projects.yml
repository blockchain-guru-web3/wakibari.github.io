# AI Event Plan Assiatant
- project: Event Planning AI
  role: Founder & Primary Developer
  duration: 2024 &mdash; Present
  # url: "#"
  description: A decentralized (Base Blockcahin) platform that leverages blockchain technology and smart contracts to create an AI-powered event assistant. This assistant can potentially automate various aspects of event planning, such as; Venue booking, Guest management, Itinerary creation,Budgeting and payment processing. By utilizing blockchain, the project aims to provide a secure, transparent, and tamper-proof way to manage events, ensuring that all stakeholders have a clear understanding of the event's progress and status. The project's AI component is expected to learn from user interactions and improve its planning capabilities over time.

