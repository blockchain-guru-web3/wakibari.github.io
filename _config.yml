# Site settings
title: "My Resume"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Edwin Wakibari"
resume_title:                   "Software Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "edwinwakibari@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+254 713 080364"
resume_contact_address:         "Nairobi, Kenya"

resume_header_contact_info:     "Nairobi, Kenya • edwinwakibari@gmail.com"
display_header_contact_info:    "true"

resume_header_intro: "<p> As a seasoned Software Engineer, I bring a proven track record of
 crafting innovative and scalable digital solutions that bridge the gap between
 cutting-edge technology and real-world business needs. With over 2 years of
 hands-on experience in the software development field, I possess the
 technical prowess and strategic mindset required to excel in today's dynamic
 and competitive landscape.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           true
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/blockchain-guru-web3"
  resume_twitter_url:           "https://x.com/baloziweb3"
  resume_devpost_url:           "https://devpost.com/edwinwakibari/challenges"
  resume_taikai_url:            "https://taikai.network/martianeddy"
  #resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/wakibari"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "https://wakibari.github.io"
  resume_medium_url:            "https://medium.com/@kiboko.dao.africa"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
